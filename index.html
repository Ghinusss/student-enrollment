<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Enrollment System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>Student Enrollment System</h1>
    <p>Fill in the form to enroll a student.</p>
  </header>

  <main class="container">
    <section class="card">
      <h2>Enrollment Form</h2>
      <div id="successMessage" class="success" role="status" hidden></div>

      <form id="enrollForm" novalidate>
        <div class="grid">
          <div class="field">
            <label for="studentId">Student ID *</label>
            <input type="text" id="studentId" name="studentId" placeholder="e.g. 2024-0001">
            <span class="error" id="studentIdError"></span>
          </div>

          <div class="field">
            <label for="prefix">Prefix</label>
            <input type="text" id="prefix" name="prefix" placeholder="e.g. Mr.">
            <span class="error" id="prefixError"></span>
          </div>

          <div class="field">
            <label for="firstName">First Name *</label>
            <input type="text" id="firstName" name="firstName">
            <span class="error" id="firstNameError"></span>
          </div>

          <div class="field">
            <label for="middleName">Middle Name</label>
            <input type="text" id="middleName" name="middleName">
            <span class="error" id="middleNameError"></span>
          </div>

          <div class="field">
            <label for="lastName">Last Name *</label>
            <input type="text" id="lastName" name="lastName">
            <span class="error" id="lastNameError"></span>
          </div>

          <div class="field">
            <label for="suffix">Suffix</label>
            <input type="text" id="suffix" name="suffix" placeholder="e.g. Jr.">
            <span class="error" id="suffixError"></span>
          </div>

          <div class="field full">
            <label for="email">Email *</label>
            <input type="email" id="email" name="email" placeholder="name@example.com">
            <span class="error" id="emailError"></span>
          </div>

          <div class="field">
            <label for="course">Course *</label>
            <select id="course" name="course">
              <option value="">Select course</option>
              <option value="BSIT">BSIT</option>
              <option value="BSCS">BSCS</option>
              <option value="BMMA">BMMA</option>
              <option value="BSAIS">BSAIS</option>
            </select>
            <span class="error" id="courseError"></span>
          </div>

          <div class="field" id="majorField" hidden>
            <label for="major">Major (BSIT) *</label>
            <select id="major" name="major">
              <option value="">Select major</option>
              <option value="Net Sec">Net Sec</option>
              <option value="Web Tech">Web Tech</option>
              <option value="ERP">ERP</option>
            </select>
            <span class="error" id="majorError"></span>
          </div>

          <div class="field">
            <label for="year">Year Level *</label>
            <select id="year" name="year">
              <option value="">Select year level</option>
              <option value="1st Year">1st Year</option>
              <option value="2nd Year">2nd Year</option>
              <option value="3rd Year">3rd Year</option>
            </select>
            <span class="error" id="yearError"></span>
          </div>
        </div>

        <button type="submit">Enroll Student</button>
      </form>
    </section>

    <section class="card">
      <h2>Enrolled Students</h2>
      <p id="emptyMessage" class="empty">No students enrolled yet. Submit the form to add one.</p>
      <div class="table-wrap">
        <table id="studentTable" hidden>
          <thead>
            <tr>
              <th>Student ID</th>
              <th>Full Name</th>
              <th>Email</th>
              <th>Course</th>
              <th>Major</th>
              <th>Year Level</th>
            </tr>
          </thead>
          <tbody id="studentBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
